<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2e0a12">
<title>Play</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%235e1622'/%3E%3Ccircle cx='27' cy='27' r='15' fill='%23f4ead5' stroke='%23e2b85c' stroke-width='5'/%3E%3Cpath d='M38 38l16 16' stroke='%23e2b85c' stroke-width='8' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/style.css">
<style>
  html, body { margin: 0; min-height: 100%; background: #12030a; color: #fff; font-family: var(--text); -webkit-tap-highlight-color: transparent; }
  body { --bg1: #5e1622; --bg2: #2e0a12; --bg3: #110306; --accent: #e2b85c; background: radial-gradient(ellipse 120% 60% at 50% 0%, var(--bg1) 0%, var(--bg2) 50%, var(--bg3) 100%) fixed; }
  * { box-sizing: border-box; }
  button { font-family: inherit; cursor: pointer; }
  .view { display: none; min-height: var(--vh, 100vh); padding: max(12px, env(safe-area-inset-top)) 14px max(24px, env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  .view.on { display: block; animation: vIn .3s ease-out; }
  @keyframes vIn { from { opacity: 0; transform: translateY(12px); } }

  /* ---- join ---- */
  .j-wrap { padding-top: 6vh; display: flex; flex-direction: column; align-items: center; }
  .j-logo { display: flex; flex-direction: column; align-items: center; gap: 10px; margin-bottom: 22px; }
  .j-logo .mk { width: 100px; height: 100px; filter: drop-shadow(0 8px 16px #000a); }
  .j-logo b { font: 400 46px/1 var(--display); letter-spacing: .05em; color: #f4ead5; text-shadow: 0 3px 0 #9b1b2a, 0 5px 0 #3a0a10; -webkit-text-stroke: 1.5px #1a0406; paint-order: stroke fill; text-align: center; }
  .j-card { width: 100%; background: #2a0910cc; border-radius: 22px; padding: 18px 18px 14px; box-shadow: 0 0 0 3px var(--accent), 0 18px 40px #0009; }
  .j-card label { display: flex; justify-content: space-between; font: 700 13px var(--text); letter-spacing: .08em; color: #e8d6c6; margin: 8px 2px 6px; }
  .j-card label span:last-child { color: #c9a9a0; font-weight: 600; letter-spacing: 0; }
  .j-card input { width: 100%; font: 800 26px var(--letter); text-transform: uppercase; letter-spacing: .06em; color: #111; background: #f4ead5; border: 0; border-radius: 12px; padding: 12px 14px; outline: none; box-shadow: inset 0 -3px 0 #0002; }
  .j-card input#code { letter-spacing: .4em; text-align: center; font-size: 34px; }
  .j-card input:focus { box-shadow: 0 0 0 3px var(--accent); }
  .j-play { width: 100%; margin-top: 16px; font: 400 32px var(--display); letter-spacing: .06em; color: #2a1800; background: linear-gradient(#f6d58a, #d9a43a); border: 0; border-radius: 999px; padding: 14px 0 10px; box-shadow: 0 6px 0 #7a5212; opacity: .55; transition: opacity .2s, transform .08s; }
  .j-play.ready { opacity: 1; }
  .j-play:active, .j-play[data-fx-press] { transform: translateY(4px); box-shadow: 0 2px 0 #7a5212; }
  .j-play.busy { animation: breathe 1.1s ease-in-out infinite; }
  @keyframes breathe { 50% { opacity: .55; } }
  #joinErr { color: #ffb4ae; font-weight: 700; min-height: 22px; margin: 12px 0 0; text-align: center; }
  #joinWait { color: #e8d6c6; margin: 6px 0 0; text-align: center; font-size: 14px; }
  .fine { color: #c9a9a0; font-size: 14px; text-align: center; line-height: 1.5; margin-top: 18px; }
  .ver { color: #9c7570; font-size: 12px; letter-spacing: .08em; margin-top: 10px; }
  #deskTv { display: none; width: 100%; text-align: center; margin-bottom: 16px; }
  #deskTv p { color: #e8d6c6; margin: 0 0 10px; }
  #deskTv span { display: block; margin-top: 14px; font: 700 12px var(--text); letter-spacing: .12em; color: #c9a9a0; }
  .tvbtn { display: inline-block; font: 400 24px var(--display); letter-spacing: .05em; color: #fff; text-decoration: none; background: linear-gradient(#b8343f, #7a1a26); border-radius: 999px; padding: 12px 26px 9px; box-shadow: 0 5px 0 #3a0a10; }
  @media (hover: hover) and (pointer: fine) { #deskTv { display: block; } .tvhint { display: none; } }
  #join.hascode #deskTv { display: none; }

  /* ---- shared bits ---- */
  .bar { display: flex; justify-content: space-between; align-items: center; font: 700 13px var(--text); letter-spacing: .08em; color: #e8d6c6; padding: 4px 4px 12px; }
  .bar b { color: #fff; }
  .card { background: #2a0910d9; border-radius: 20px; padding: 16px; margin-bottom: 14px; box-shadow: 0 10px 30px #0006, inset 0 1px 0 #ffffff1a; }
  .card.mine { box-shadow: 0 0 0 2px var(--accent), 0 10px 30px #0006; }
  .card.bad { box-shadow: 0 0 0 2px var(--red), 0 10px 30px #0006; }
  .card.flat { padding: 6px 14px 12px; }
  .card h3 { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin: 0 0 12px; font: 400 22px var(--display); letter-spacing: .06em; color: var(--accent); white-space: nowrap; }
  .card h3 small { font: 700 11px var(--text); letter-spacing: .06em; color: #c9a9a0; text-align: right; white-space: normal; max-width: 60%; line-height: 1.3; }
  .who { display: flex; flex-wrap: wrap; gap: 8px; }
  .who span { display: inline-flex; align-items: center; gap: 7px; font: 700 15px var(--text); padding: 6px 14px 6px 6px; border-radius: 999px; background: #ffffff14; }
  .who span.me { background: var(--accent); color: #2a1800; }
  .who span.off { opacity: .5; }
  .who span .med { width: 26px; height: 26px; font-size: 20px; }
  .who span .tag { font: 400 11px/1 var(--display); letter-spacing: .14em; padding: 3px 6px 1px; border-radius: 999px; background: #2a6fd8; color: #fff; }
  .who em { color: #c9a9a0; }
  .btn { display: block; width: 100%; margin-top: 10px; font: 400 26px var(--display); letter-spacing: .05em; color: #fff; background: linear-gradient(#b8343f, #7a1a26); border: 0; border-radius: 999px; padding: 14px 10px 11px; box-shadow: 0 5px 0 #3a0a10; transition: transform .08s, box-shadow .08s, opacity .2s; }
  .btn:active:not(:disabled), .btn[data-fx-press]:not(:disabled) { transform: translateY(4px); box-shadow: 0 1px 0 #3a0a10; }
  .btn.gold { color: #2a1800; background: linear-gradient(#f6d58a, #d9a43a); box-shadow: 0 5px 0 #7a5212; }
  .btn.red { color: #fff; background: linear-gradient(#ff6a60, #c41410); box-shadow: 0 5px 0 #5a0905; }
  .btn.ghost { background: transparent; color: #fff; box-shadow: inset 0 0 0 2px #a8525c; }
  .btn.sm { font-size: 19px; padding: 11px 8px 9px; }
  .btn.big { font-size: 34px; padding: 18px 10px 13px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.glow { animation: glow 1.6s ease-in-out infinite; }
  @keyframes glow { 50% { box-shadow: 0 5px 0 #7a5212, 0 0 30px #e2b85caa; } }
  .note { color: #e8d6c6; font-size: 14px; line-height: 1.5; margin: 10px 2px 0; text-align: center; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
  .row2 .btn, .row3 .btn { margin-top: 0; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .label { font: 700 12px var(--text); letter-spacing: .1em; color: #c9a9a0; margin: 14px 2px 8px; }
  .story { font: italic 15px/1.5 var(--serif); color: #f3e4dc; margin: 0 0 10px; }

  /* lobby: pick your suspect */
  .susp { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .susp button { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border: 0; border-radius: 16px; background: #ffffff10; color: #fff; text-align: left; transition: transform .1s, background .2s; min-height: 66px; }
  .susp button .med { width: 48px; height: 48px; flex: none; font-size: 40px; }
  .susp button b { display: block; font: 400 17px/1.05 var(--display); letter-spacing: .03em; }
  .susp button small { display: block; font: 700 11px var(--text); letter-spacing: .06em; color: #c9a9a0; margin-top: 3px; }
  .susp button.on { background: var(--accent); color: #2a1800; box-shadow: 0 0 0 3px #fff; }
  .susp button.on small { color: #4a2c00; }
  .susp button:disabled { opacity: .45; cursor: default; }
  .setupTxt { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .setupTxt h4 { margin: 0 0 4px; font: 700 12px var(--text); letter-spacing: .1em; color: #c9a9a0; }
  .setupTxt ul { margin: 0; padding: 0 0 0 14px; font-size: 14px; line-height: 1.5; }

  /* ---- play ---- */
  .top { display: flex; align-items: center; gap: 12px; padding: 4px 2px 12px; }
  .top .med { width: 54px; height: 54px; font-size: 46px; flex: none; box-shadow: 0 0 0 3px #fff3; }
  .top .nm { font: 400 26px/1 var(--display); letter-spacing: .05em; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-top: 3px; }
  .top .nm small { display: block; font: 700 12px var(--text); letter-spacing: .04em; color: #c9a9a0; margin-top: 4px; text-transform: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .cnt { text-align: right; font: 400 30px/1 var(--display); }
  .top .cnt small { display: block; font: 700 11px var(--text); letter-spacing: .08em; color: #e8d6c6; margin-top: 3px; }
  .say { text-align: center; padding: 6px 6px 6px; }
  .say b { display: block; font: 400 30px/1.05 var(--display); letter-spacing: .04em; color: var(--accent); }
  .say span { display: block; font: 600 15px/1.45 var(--text); color: #f3e4dc; margin-top: 6px; }
  .say.good b { color: #7dffb8; } .say.bad b { color: #ff8a80; }
  .clock { height: 8px; border-radius: 4px; background: #ffffff1f; overflow: hidden; margin: 12px 4px 0; flex: none; }
  .clock i { display: block; height: 100%; width: 100%; background: #fff; transform-origin: left; }
  .clock.hot i { background: #ff6a60; }
  .card.main { height: 420px; display: flex; flex-direction: column; overflow-y: auto; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
  .card.main > * { flex: none; }
  .card.main > :first-child { margin-top: auto; } .card.main > :last-child { margin-bottom: auto; }
  .roll { display: block; width: min(46vw, 180px); aspect-ratio: 1; margin: 8px auto 6px; border-radius: 50%; border: 0; font: 400 46px var(--display); letter-spacing: .05em; color: #2a1800; background: radial-gradient(circle at 40% 30%, #fff3c4, #e2b85c 45%, #a9792a); box-shadow: 0 11px 0 #5a3a08, 0 0 0 8px #ffffff1a, 0 24px 40px #0009; transition: transform .07s, box-shadow .07s; touch-action: manipulation; animation: rollGlow 1.8s ease-in-out infinite; }
  @keyframes rollGlow { 50% { box-shadow: 0 11px 0 #5a3a08, 0 0 0 14px #e2b85c33, 0 24px 40px #0009; } }
  .roll:active, .roll[data-fx-press] { transform: translateY(8px); box-shadow: 0 3px 0 #5a3a08, 0 0 0 8px #ffffff1a; }
  .roll.spin { animation: rollSpin .6s ease-out; }
  @keyframes rollSpin { 20% { transform: rotate(-12deg) scale(.95); } 60% { transform: rotate(10deg) scale(1.03); } }
  .dice { display: flex; gap: 12px; justify-content: center; margin: 4px 0 6px; }
  .die { width: 46px; height: 46px; border-radius: 10px; background: #fff; display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); padding: 6px; box-shadow: 0 4px 0 #0004; }
  .die i { border-radius: 50%; background: #7a1a26; opacity: 0; margin: 2px; }
  .die i.on { opacity: 1; }
  /* where to go */
  .dest { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; border-radius: 14px; padding: 9px 12px; margin-top: 7px; background: #ffffff10; color: #fff; text-align: left; }
  .dest .ri { width: 30px; height: 30px; flex: none; font-size: 24px; display: flex; align-items: center; justify-content: center; }
  .dest b { flex: 1; min-width: 0; font: 400 19px/1.1 var(--display); letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .dest small { flex: none; font: 700 12px var(--text); letter-spacing: .04em; color: #c9a9a0; text-align: right; }
  .dest.in { background: var(--accent); color: #2a1800; box-shadow: 0 4px 0 #7a5212; }
  .dest.in small { color: #4a2c00; }
  .dest.in.useful { box-shadow: 0 4px 0 #7a5212, 0 0 0 2px #fff; }
  .dest:disabled { opacity: .35; }
  .dest .k { font: 400 10px/1 var(--display); letter-spacing: .12em; padding: 3px 6px 1px; border-radius: 999px; background: #0003; margin-left: 6px; vertical-align: 2px; }
  .hand { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 8px 0 4px; }
  .pick .ccard { cursor: pointer; transition: transform .15s, box-shadow .15s; }
  .pick .ccard.on { transform: translateY(-8px) scale(1.04); box-shadow: 0 0 0 .18em #2b1a0c, 0 0 0 .5em var(--accent), 0 .8em 1.6em #000c, inset 0 0 0 .5em #fff, inset 0 0 0 .62em var(--band); }
  .ccard .seen { position: absolute; left: 0; right: 0; bottom: 0; font: 700 9px/1.2 var(--text); letter-spacing: .04em; background: #2a6fd8; color: #fff; padding: 3px 2px; }
  .asks { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 10px; }
  .asks span { display: inline-flex; align-items: center; gap: 6px; font: 700 13px var(--text); padding: 4px 10px 4px 4px; border-radius: 999px; background: #ffffff12; }
  .asks span .med { width: 22px; height: 22px; font-size: 17px; }
  .asks span.now { background: var(--accent); color: #2a1800; }
  .asks span.no { opacity: .55; text-decoration: line-through; }
  .asks span.yes { background: #2a6fd8; }
  .asks span.wait { opacity: .45; }

  /* tabs */
  .tabs { display: flex; gap: 6px; margin: 2px 0 12px; }
  .tabs button { flex: 1; border: 0; border-radius: 12px; padding: 11px 2px; font: 700 13.5px var(--text); color: #fff; background: #ffffff1a; position: relative; }
  .tabs button.on { background: var(--accent); color: #2a1800; }
  .tabs button .n { position: absolute; top: -7px; right: -4px; background: var(--red); color: #fff; font: 800 11px var(--text); min-width: 20px; height: 20px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 5px; box-shadow: 0 0 0 2px #2a0910; }

  /* the detective notebook */
  .nb { width: 100%; border-collapse: separate; border-spacing: 0; table-layout: fixed; }
  .nb th { font: 700 10px var(--text); letter-spacing: .02em; color: #e8d6c6; padding: 6px 0 6px; text-align: center; white-space: nowrap; overflow: hidden; }
  .nb th i { display: block; width: 14px; height: 14px; border-radius: 50%; margin: 0 auto 3px; background: linear-gradient(var(--c1), var(--c2)); box-shadow: 0 0 0 1.5px #0006; }
  .nb th.me { color: var(--accent); }
  .nb th:first-child { width: 42%; text-align: left; }
  .nb tr.sec td { font: 400 15px/1 var(--display); letter-spacing: .14em; color: var(--accent); padding: 12px 0 6px; }
  .nb td { padding: 0; border-bottom: 1px solid #ffffff10; height: 38px; }
  .nb td.nm { font: 700 13px/1.15 var(--text); padding-right: 4px; color: #fff; }
  .nb td.nm span { display: flex; align-items: center; gap: 6px; }
  .nb td.nm .ri { width: 20px; height: 20px; flex: none; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
  .nb td.nm .ri .med { width: 18px; height: 18px; font-size: 14px; }
  .nb td.nm .ri .ico { width: 18px; height: 18px; }
  .nb td.nm em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nb tr.known td.nm em { color: #9c7570; text-decoration: line-through; text-decoration-color: #e0303eaa; text-decoration-thickness: 2px; }
  .nb tr.hit td { background: #e2b85c2e; } .nb tr.hit td.nm em { color: var(--accent); }
  .nb tr.hit td.nm em::after { content: " !"; color: var(--accent); font-weight: 900; }
  .nb td.mk { text-align: center; }
  .nb td.mk button { width: 100%; height: 36px; border: 0; background: transparent; color: #fff; font: 900 19px/1 var(--text); padding: 0; border-left: 1px solid #ffffff0d; }
  .nb td.mk button.x { color: #ff6a60; } .nb td.mk button.o { color: #6dffa8; } .nb td.mk button.q { color: var(--accent); }
  .nb td.mk button:active { background: #ffffff1a; }
  .nbKey { font-size: 12px; color: #c9a9a0; text-align: center; line-height: 1.5; margin: 10px 0 2px; }
  .nbKey b.x { color: #ff6a60; } .nbKey b.o { color: #6dffa8; } .nbKey b.q { color: var(--accent); }

  .shown { display: flex; align-items: center; gap: 12px; padding: 9px 0; border-bottom: 1px solid #ffffff10; font-size: 14px; color: #e8d6c6; }
  .shown:last-child { border-bottom: 0; }
  .shown b { color: #fff; }
  .hist { padding: 10px 0; border-bottom: 1px solid #ffffff10; }
  .hist:last-child { border-bottom: 0; }
  .hist .h1 { display: flex; align-items: center; gap: 8px; font: 700 14px/1.35 var(--text); }
  .hist .h1 .med { width: 24px; height: 24px; font-size: 19px; flex: none; }
  .hist .h1 small { color: #c9a9a0; font-weight: 700; }
  .hist .h2 { font-size: 13px; color: #e8d6c6; margin: 4px 0 0 32px; line-height: 1.5; }
  .hist .h2 .x { color: #ff8a80; } .hist .h2 .y { color: #9fd3ff; } .hist .h2 .n { color: #ff6a60; font-weight: 800; } .hist .h2 .me { color: #6dffa8; font-weight: 800; }
  .mapw { position: relative; width: 100%; aspect-ratio: 960 / 1000; border-radius: 10px; overflow: hidden; box-shadow: 0 0 0 3px var(--accent), 0 10px 30px #0008; }
  .mapw svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .mapLegend { font-size: 12px; color: #c9a9a0; text-align: center; margin-top: 10px; line-height: 1.5; }

  /* chat */
  .chatList div.row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #ffffff14; cursor: pointer; }
  .chatList div.row:last-child { border-bottom: 0; }
  .chatList .med { width: 40px; height: 40px; font-size: 34px; flex: none; }
  .chatList .nm { flex: 1; min-width: 0; font-weight: 700; font-size: 16px; }
  .chatList .nm small { display: block; color: #c9a9a0; font-weight: 600; font-size: 13px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chatList .n { background: var(--red); color: #fff; font: 800 12px var(--text); min-width: 22px; height: 22px; border-radius: 999px; display: flex; align-items: center; justify-content: center; padding: 0 6px; }
  .chatHead { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .chatHead button { border: 0; background: #ffffff1a; color: #fff; border-radius: 10px; padding: 8px 12px; font-weight: 800; }
  .chatHead b { flex: 1; font: 400 22px var(--display); letter-spacing: .05em; }
  .chatHead .med { width: 32px; height: 32px; font-size: 26px; }
  .msgs { display: flex; flex-direction: column; gap: 6px; max-height: 50vh; overflow: auto; padding: 4px 0; }
  .msg { max-width: 82%; padding: 9px 13px; border-radius: 16px; font-size: 15px; line-height: 1.4; background: #ffffff18; align-self: flex-start; border-bottom-left-radius: 4px; word-wrap: break-word; }
  .msg.me { align-self: flex-end; background: var(--accent); color: #2a1800; border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
  .chatIn { display: flex; gap: 8px; margin-top: 10px; }
  .chatIn input { flex: 1; min-width: 0; font: 600 16px var(--text); color: #111; background: #fff; border: 0; border-radius: 999px; padding: 12px 16px; outline: none; }
  .chatIn .btn { width: auto; margin: 0; padding: 10px 18px 8px; font-size: 20px; }
  .empty { text-align: center; color: #c9a9a0; font-size: 14px; padding: 16px 6px; line-height: 1.5; }
  .leaveLink { display: block; text-align: center; margin: 22px 0 8px; color: #c9a9a0; font-size: 14px; }
  .ranks div { display: flex; align-items: center; gap: 10px; padding: 8px 2px; border-bottom: 1px solid #ffffff14; font-weight: 700; font-size: 15px; }
  .ranks div .med { width: 26px; height: 26px; font-size: 20px; flex: none; }
  .ranks div span { flex: 1; min-width: 0; }
  .ranks div small { color: #c9a9a0; font-weight: 700; font-size: 12px; }
  .award { display: inline-block; font: 700 12px var(--text); letter-spacing: .06em; background: var(--accent); color: #2a1800; border-radius: 999px; padding: 5px 11px; margin: 0 4px 4px 0; }

  /* the suggestion / accusation sheet */
  .sheetBack { position: fixed; inset: 0; z-index: 80; background: #120306cc; display: flex; align-items: flex-end; justify-content: center; animation: dlgIn .2s ease-out; }
  .sheetBack.out { animation: dlgOut .18s ease-in forwards; pointer-events: none; }
  .sheet { width: 100%; max-width: 560px; max-height: 94vh; overflow: auto; background: linear-gradient(#4a111c, #2a0910); border-radius: 24px 24px 0 0; padding: 14px 14px max(20px, env(safe-area-inset-bottom)); box-shadow: 0 -10px 40px #000a; animation: sheetUp .3s cubic-bezier(.2, 1, .4, 1); }
  .sheet.acc { background: linear-gradient(#3a0a10, #1d0509); box-shadow: 0 -10px 40px #000a, inset 0 3px 0 var(--red); }
  @keyframes sheetUp { from { transform: translateY(60px); opacity: 0; } }
  .sheet .grip { width: 44px; height: 5px; border-radius: 3px; background: #ffffff33; margin: 0 auto 10px; }
  .sheet h2 { margin: 0 0 4px; font: 400 26px/1.1 var(--display); letter-spacing: .05em; color: var(--accent); text-align: center; }
  .sheet .sub { text-align: center; font-size: 14px; color: #e8d6c6; margin: 0 0 6px; line-height: 1.4; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 7px; }
  .tile { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 0; border-radius: 14px; padding: 9px 4px 8px; background: #ffffff12; color: #fff; min-height: 84px; transition: transform .1s, background .2s; }
  .tile .pic { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; font-size: 30px; }
  .tile .pic .med { width: 40px; height: 40px; font-size: 32px; }
  .tile .pic .ico { width: 36px; height: 36px; }
  .tile b { font: 400 13px/1.1 var(--display); letter-spacing: .03em; text-align: center; word-break: break-word; }
  .tile i { position: absolute; top: 5px; right: 5px; font: 800 9px var(--text); font-style: normal; letter-spacing: .04em; padding: 2px 5px; border-radius: 6px; background: #000a; color: #c9a9a0; }
  .tile i.mine { background: var(--accent); color: #2a1800; } .tile i.hit { background: #6dffa8; color: #06301f; }
  .tile.known { opacity: .55; }
  .tile.on { background: var(--accent); color: #2a1800; box-shadow: 0 0 0 3px #fff; opacity: 1; transform: scale(1.03); }
  .sumLine { text-align: center; font: italic 16px/1.45 var(--serif); color: #f3e4dc; margin: 12px 4px 0; min-height: 46px; }

  #pop { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; z-index: 90; pointer-events: none; }
  #pop.on { display: flex; }
  #pop > div { padding: 24px 30px 20px; border-radius: 26px; text-align: center; animation: popIn .32s cubic-bezier(.2, 1.4, .4, 1); max-width: 88vw; }
  #pop.out > div { animation: popOut .25s ease-in forwards; }
  @keyframes popIn { from { transform: scale(.3); opacity: 0; } }
  @keyframes popOut { to { transform: scale(.8); opacity: 0; } }
  #pop b { display: block; font: 400 44px/1 var(--display); letter-spacing: .03em; }
  #pop span { display: block; font: 700 16px var(--text); margin-top: 8px; }
  #pop.good > div { color: #06301f; background: linear-gradient(#7dffb8, #2bbd6e); box-shadow: 0 0 0 5px #fff, 0 20px 50px #000c; }
  #pop.bad > div { color: #fff; background: linear-gradient(#333, #000); box-shadow: 0 0 0 5px var(--red), 0 20px 50px #000c; }
  #pop.turn > div { color: #2a1800; background: linear-gradient(#f6d58a, #d9a43a); box-shadow: 0 0 0 5px #fff, 0 20px 50px #000c; }
  #pop.dark > div { color: var(--accent); background: linear-gradient(#5e1622, #2e0a12); box-shadow: 0 0 0 5px var(--accent), 0 20px 50px #000c; }
  #toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom)); transform: translateX(-50%); background: #2e0a12; color: #fff; font-weight: 700; font-size: 15px; padding: 11px 18px; border-radius: 999px; box-shadow: 0 0 0 2px var(--accent), 0 10px 30px #000a; z-index: 95; display: none; max-width: 92vw; text-align: center; }
  #toast.on { display: block; animation: popIn .25s ease-out; }
  #toast.out { animation: popOut .2s ease-in forwards; }
  #offline { position: fixed; left: 50%; top: max(8px, env(safe-area-inset-top)); transform: translateX(-50%); background: #7a1512; color: #fff; font-weight: 700; font-size: 14px; padding: 7px 16px; border-radius: 999px; z-index: 96; display: none; white-space: nowrap; }
  #offline.on { display: block; }
</style>
</head>
<body>

<section class="view on" id="join">
  <div class="j-wrap">
    <div class="j-logo"><div class="mk" data-logo></div><b data-title></b></div>
    <div id="deskTv">
      <p>Looks like you're on a computer. Is this the one plugged into the TV?</p>
      <a class="tvbtn" href="/tv">Open the game board</a>
      <span>OR JOIN AS A PLAYER</span>
    </div>
    <form id="joinForm" class="j-card" autocomplete="off">
      <label for="code"><span>ROOM CODE</span><span class="tvhint">it's on the TV</span></label>
      <input id="code" maxlength="4" placeholder="••••" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <label for="name"><span>YOUR NAME</span><span id="nameLeft">12</span></label>
      <input id="name" maxlength="12" placeholder="Type your name" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button class="j-play" id="playBtn">PLAY</button>
      <p id="joinErr"></p>
      <p id="joinWait"></p>
    </form>
    <p class="fine">Lost your connection, or picking up a saved game? Use the same name you had and you get your cards and notebook back.</p>
    <p class="ver" id="ver"></p>
  </div>
</section>

<section class="view" id="lobby"></section>
<section class="view" id="play"></section>

<div id="pop"><div><b></b><span></span></div></div>
<div id="toast"></div>
<div id="offline">Reconnecting…</div>

<script src="/boards.js"></script>
<script src="/common.js"></script>
<script>
(function () {
  'use strict';
  var F = window.Game, B = window.Boards, $ = F.$, esc = F.esc, sfx = F.sfx;
  var sess = F.store.get('clue.me', null);      // { code, token, name }
  var S = null, me = null, conn = null, hello = null, lastSeq = null;
  var triedRejoinByName = false, typed = false;
  var waiting = false, waited = false, waitTimer = null, online = false, LIVE_MS = 15 * 60 * 1000;
  var ui = { tab: 'notes', chatWith: null, sheet: null, pick: null, show: null };   // what this phone has open
  var SC = B.SUSPECT_COLORS;

  function waitForGame() {
    waiting = true; waited = true;
    var bar = $('#offline');
    bar.textContent = 'Hang tight. Bringing your game back…';
    bar.classList.add('on');
    clearTimeout(waitTimer);
    waitTimer = setTimeout(function () { if (waiting && conn && hello) conn.send(hello); }, 2000);
  }
  function stopWaiting() {
    if (!waiting) return;
    waiting = false; clearTimeout(waitTimer);
    var bar = $('#offline');
    bar.classList.remove('on'); bar.textContent = 'Reconnecting…';
  }

  document.querySelectorAll('[data-title]').forEach(function (n) { n.textContent = F.TITLE; });
  document.querySelectorAll('[data-logo]').forEach(function (n) { n.innerHTML = F.LOGO; });
  document.title = F.TITLE;
  $('#ver').textContent = 'VERSION ' + F.VERSION;
  F.pressFx();

  function show(id) { document.querySelectorAll('.view').forEach(function (n) { n.classList.toggle('on', n.id === id); }); }
  var toastTimer, toastOut;
  function toast(msg) {
    var t = $('#toast');
    clearTimeout(toastTimer); clearTimeout(toastOut);
    t.textContent = msg; t.classList.remove('out');
    if (t.classList.contains('on')) F.bump(t, 1.06); else t.classList.add('on');
    toastTimer = setTimeout(function () { t.classList.add('out'); toastOut = setTimeout(function () { t.classList.remove('on', 'out'); }, 200); }, 3000);
  }
  var popTimer, popOut;
  function pop(kind, title, sub, ms) {
    var el = $('#pop');
    clearTimeout(popTimer); clearTimeout(popOut);
    el.className = ''; void el.offsetWidth;
    el.querySelector('b').textContent = title;
    el.querySelector('span').textContent = sub || '';
    el.className = 'on ' + kind;
    popTimer = setTimeout(function () { el.classList.add('out'); popOut = setTimeout(function () { el.className = ''; }, 260); }, ms || 1500);
  }
  function hidePop() { clearTimeout(popTimer); clearTimeout(popOut); $('#pop').className = ''; }
  function buzzPhone(ms) { try { if (navigator.vibrate) navigator.vibrate(ms); } catch (e) { /* ignore */ } }
  function send(m) { if (!conn || !conn.send(m)) toast('Reconnecting… try again in a second'); }
  function player(id) { return S ? (S.players.filter(function (p) { return p.id === id; })[0] || null) : null; }
  function pname(id) { var p = player(id); return p ? p.name : '?'; }
  function G() { return S.game; }
  function T() { return S.theme; }
  function suspectOf(id) { var g = S.game; if (g && g.players[id]) return g.players[id].suspect; var p = player(id); return p ? p.suspect : 0; }
  function med(i) { return F.suspectArt(T(), i); }
  function cname(c) { return B.cardName(T(), c); }
  function sName(i) { return T().suspects[i].name; }
  function rThe(i) { return B.roomThe(T(), i); }
  function wThe(i) { return B.weaponThe(T(), i); }
  function say3(s, w, r) { return sName(B.cardIndex(s)) + ', in ' + rThe(B.cardIndex(r)) + ', with ' + wThe(B.cardIndex(w)); }
  function whereIs(s) {
    var at = G().pawns[s];
    if (at.r != null) return 'in ' + rThe(at.r);
    var st = B.STARTS[s];
    return at.x === st.x && at.y === st.y ? 'at the start' : 'in the hallway';
  }

  function fitViewport() {
    var vv = window.visualViewport;
    document.documentElement.style.setProperty('--vh', (vv ? vv.height : innerHeight) + 'px');
  }
  if (window.visualViewport) visualViewport.addEventListener('resize', fitViewport);
  addEventListener('resize', fitViewport); fitViewport();

  // The phone takes the board's colors too.
  var lookId = null;
  function applyLook() {
    var L = B.lookOf(T()), id = T().id + L.bg.join();
    if (lookId === id) return; lookId = id;
    var b = document.body.style;
    b.setProperty('--bg1', L.bg[0]); b.setProperty('--bg2', L.bg[1]); b.setProperty('--bg3', L.bg[2]); b.setProperty('--accent', L.accent);
  }

  /* ------------------------------------------------------------- join */
  var codeIn = $('#code'), nameIn = $('#name');
  var qCode = (new URLSearchParams(location.search).get('code') || '').toUpperCase().replace(/[^A-Z]/g, '').slice(0, 4);
  codeIn.value = qCode || '';
  if (qCode) $('#join').classList.add('hascode');
  nameIn.value = F.store.get('clue.name', '');
  function joinReady() {
    codeIn.value = codeIn.value.toUpperCase().replace(/[^A-Z]/g, '');
    $('#nameLeft').textContent = (12 - nameIn.value.length) + ' left';
    var ok = codeIn.value.length === 4 && nameIn.value.trim().length > 0;
    $('#playBtn').classList.toggle('ready', ok);
    if (ok && /^Enter the/.test($('#joinErr').textContent)) $('#joinErr').textContent = '';
    return ok;
  }
  codeIn.addEventListener('input', joinReady); nameIn.addEventListener('input', joinReady); joinReady();
  $('#joinForm').addEventListener('submit', function (e) {
    e.preventDefault();
    sfx.unlock();
    if (!joinReady()) { $('#joinErr').textContent = 'Enter the 4-letter room code and your name.'; F.shake($('#joinForm')); return; }
    $('#joinErr').textContent = '';
    typed = true;
    F.store.set('clue.name', nameIn.value.trim().toUpperCase());
    joinBusy(true);
    var nm = nameIn.value.trim();
    if (sess && sess.token && sess.code === codeIn.value && sess.name === nm.toUpperCase()) { triedRejoinByName = false; start({ t: 'rejoin', code: sess.code, token: sess.token }); }
    else start({ t: 'join', code: codeIn.value, name: nm, suspect: F.store.get('clue.suspect', null) });
  });
  var busyTimer;
  function joinBusy(on) {
    var b = $('#playBtn');
    clearTimeout(busyTimer);
    b.classList.toggle('busy', on);
    b.textContent = on ? 'JOINING…' : 'PLAY';
    $('#joinWait').textContent = '';
    if (on) busyTimer = setTimeout(function () { $('#joinWait').textContent = 'Waking the game up. The first join of the night can take up to a minute.'; }, 3500);
  }
  function start(h) {
    hello = h; lastSeq = null;
    if (!conn) {
      conn = F.connect({
        hello: function () { return hello; },
        onMessage: onMessage,
        onStatus: function (ok) { online = ok; $('#offline').classList.toggle('on', !ok && !!S); }
      });
    } else if (!conn.send(h)) { joinBusy(false); $('#joinErr').textContent = 'Connecting… tap PLAY again in a moment.'; }
  }
  function backToJoin(msg) {
    stopWaiting();
    S = null; me = null; hello = null; sess = null; ui = { tab: 'notes', chatWith: null, sheet: null, pick: null, show: null };
    F.store.del('clue.me');
    closeSheet(true); hidePop(); joinBusy(false);
    show('join');
    $('#joinErr').textContent = msg || '';
    if (msg) F.shake($('#joinForm'));
  }

  function onMessage(m) {
    if (m.t === 'joined') {
      joinBusy(false); stopWaiting(); waited = false;
      sess = { code: m.code, token: m.token, name: (sess && sess.name) || nameIn.value.trim().toUpperCase(), at: Date.now() };
      F.store.set('clue.me', sess);
      hello = { t: 'rejoin', code: m.code, token: m.token };
      triedRejoinByName = false;
      F.stayAwake();
    } else if (m.t === 'error') {
      var ours = sess && hello && (hello.t === 'rejoin' || (hello.t === 'join' && String(hello.code).toUpperCase() === sess.code));
      if (m.code === 'noroom' && m.wait && ours && (S || Date.now() - (sess.at || 0) < LIVE_MS)) {
        waitForGame();
      } else if (m.code === 'noroom' && hello && hello.t === 'rejoin' && sess && sess.name && !triedRejoinByName) {
        triedRejoinByName = true;
        hello = { t: 'join', code: sess.code, name: sess.name };
        conn.send(hello);
      } else if (!S || m.code === 'noroom') {
        if (waited && sess && m.code === 'noroom') {
          var keep = sess;
          backToJoin('Your game hasn’t come back yet. Once the TV shows it again, tap PLAY to jump back in.');
          sess = keep; F.store.set('clue.me', keep);
          codeIn.value = keep.code; if (keep.name) nameIn.value = keep.name; joinReady(); waited = false;
        } else backToJoin(typed || S ? m.msg : '');
      } else { toast(m.msg); buzzPhone(60); }
    } else if (m.t === 'left') {
      if (conn && m.replaced) { conn.stop(); conn = null; }
      backToJoin(m.kicked ? 'You were removed from the game.' : m.replaced ? 'This game was opened on another device or tab.' : '');
    } else if (m.t === 'state') {
      if ($('#playBtn').classList.contains('busy')) joinBusy(false);
      if (sess && Date.now() - (sess.at || 0) > 20000) { sess.at = Date.now(); F.store.set('clue.me', sess); }
      var list = m.s.fx || [], fresh = [];
      if (lastSeq === null) lastSeq = list.length ? list[list.length - 1].seq : 0;
      else { fresh = list.filter(function (e) { return e.seq > lastSeq; }); if (fresh.length) lastSeq = fresh[fresh.length - 1].seq; }
      // Keep notebook marks made on this phone that the server hasn't confirmed yet.
      if (pendingNotes.length && m.s.me && m.s.me.notes) pendingNotes.forEach(function (n) { var row = m.s.me.notes[n.c] || (m.s.me.notes[n.c] = {}); if (n.m) row[n.p] = n.m; else delete row[n.p]; });
      S = m.s; me = S.me;
      render(fresh);
    }
  }
  if (sess && sess.code && sess.token && (!qCode || qCode === sess.code)) start({ t: 'rejoin', code: sess.code, token: sess.token });
  setInterval(function () { if (S && sess && online) { sess.at = Date.now(); F.store.set('clue.me', sess); } }, 60000);

  /* ----------------------------------------------------------- render */
  var lastChatCount = {};
  function render(fresh) {
    var has = {};
    fresh.forEach(function (e) { has[e.type] = e; });
    applyLook();
    if (has.restored) toast('We’re back. Right where we left off.');
    if (has.loaded) toast('Picked up where you left off. Welcome back.');
    chatPings();
    if (S.phase === 'lobby') { closeSheet(true); hidePop(); renderLobby(); show('lobby'); return; }
    show('play');
    if (ui.sheet && !sheetStillOk()) closeSheet();
    renderPlay(has);
    if (ui.sheet) renderSheet();
  }

  /* ------------------------------------------------------------ chat bookkeeping */
  function seenKey() { return 'clue.seen.' + (S ? S.code : ''); }
  function seenChats() { return F.store.get(seenKey(), {}); }
  function unreadFrom(peer) {
    var list = (me.chats || {})[peer] || [], sn = seenChats()[peer] || 0, n = 0;
    list.forEach(function (m, k) { if (k >= sn && m.from === peer) n++; });
    return n;
  }
  function markSeen(peer) { var s = seenChats(); s[peer] = ((me.chats || {})[peer] || []).length; F.store.set(seenKey(), s); }
  function unreadTotal() { var n = 0; Object.keys(me.chats || {}).forEach(function (p) { n += unreadFrom(p); }); return n; }
  function chatPings() {
    if (!me) return;
    Object.keys(me.chats || {}).forEach(function (peer) {
      var list = me.chats[peer], was = lastChatCount[peer] || 0;
      if (list.length > was && was > 0 && list[list.length - 1].from === peer) {
        if (ui.tab === 'chat' && ui.chatWith === peer) markSeen(peer);
        else { sfx.ping(); buzzPhone(40); toast(pname(peer) + ': ' + list[list.length - 1].text.slice(0, 60)); }
      }
      lastChatCount[peer] = list.length;
    });
  }

  /* ------------------------------------------------------------ lobby */
  function renderLobby() {
    var t = T();
    var h = '<div class="bar"><span>ROOM <b>' + esc(S.code) + '</b></span><span>' + esc(me.name) + (me.isCaptain ? ' · CAPTAIN' : '') + '</span></div>';
    h += '<div class="card mine" data-key="pick"><h3><span>WHO ARE YOU?</span><small>' + esc(sName(me.suspect)) + ' · TAP TO CHANGE</small></h3><div class="susp">' +
      t.suspects.map(function (x, i) {
        var taken = S.players.filter(function (p) { return p.suspect === i && p.id !== me.id; })[0];
        return '<button data-a="suspect" data-s="' + i + '" class="' + (me.suspect === i ? 'on' : '') + '"' + (taken ? ' disabled' : '') + '>' + med(i) + '<span><b>' + esc(x.name) + '</b><small>' + (taken ? esc(taken.name) : me.suspect === i ? 'YOU' : i === 0 ? 'GOES FIRST' : '') + '</small></span></button>';
      }).join('') + '</div></div>';
    h += '<div class="card" data-key="players"><h3><span>PLAYERS</span><small>' + S.players.length + ' OF ' + S.maxPlayers + '</small></h3><div class="who">' +
      (S.players.length ? S.players.map(function (p) { return '<span class="' + (p.id === me.id ? 'me' : '') + (p.on ? '' : ' off') + '">' + med(p.suspect) + esc(p.name) + (p.bot ? '<span class="tag">BOT</span>' : '') + '</span>'; }).join('') : '<em>Nobody yet</em>') + '</div>';
    h += '<p class="note">The TV picks the board and the rules. ' + (me.isCaptain ? 'You can start it from here or from the TV.' : 'The TV, or ' + esc(pname(S.captain)) + ', starts it.') + '</p>';
    if (me.isCaptain) h += '<button class="btn gold big' + (S.players.length >= S.minPlayers ? ' glow' : '') + '" data-a="start"' + (S.players.length >= S.minPlayers ? '' : ' disabled') + '>Start the game</button>';
    h += '</div>';
    var st = S.settings, NOTE = { basic: 'fills in your cards and what you’re shown', full: 'also marks who couldn’t disprove', off: 'blank: you write it all' };
    h += '<div class="card" data-key="setup"><h3><span>THE CASE</span><small>' + esc(t.name.toUpperCase()) + (t.adult ? ' · 18+' : '') + '</small></h3><p class="story">' + esc(t.story) + '</p><div class="setupTxt"><div><h4>RULES</h4><ul><li>' + (st.dice === 2 ? 'two dice' : 'one die') + '</li><li>' + (st.turnSecs ? st.turnSecs + 's turn clock' : 'no turn clock') + '</li></ul></div><div><h4>NOTEBOOK</h4><ul><li>' + NOTE[st.notes] + '</li></ul></div></div></div>';
    h += '<a class="link leaveLink" href="#" data-a="leave">Leave this room</a>';
    F.morph($('#lobby'), h);
  }

  /* ------------------------------------------------------------- play */
  var PIPS = { 1: [4], 2: [0, 8], 3: [0, 4, 8], 4: [0, 2, 6, 8], 5: [0, 2, 4, 6, 8], 6: [0, 2, 3, 5, 6, 8] };
  function die(n) { return '<div class="die">' + [0, 1, 2, 3, 4, 5, 6, 7, 8].map(function (k) { return '<i class="' + ((PIPS[n] || []).indexOf(k) >= 0 ? 'on' : '') + '"></i>'; }).join('') + '</div>'; }
  function roomIcon(i) { return F.icon(T().rooms[i].icon); }

  function renderPlay(has) {
    var g = G(), c = SC[me.suspect], mine = g.players[me.id];
    var h = '<div class="top">' + med(me.suspect) + '<div class="nm">' + esc(me.name) + '<small>' + esc(sName(me.suspect)) + (mine ? ' · ' + esc(me.left ? 'left the game' : me.out ? 'out · still shows cards' : whereIs(mine.suspect)) : '') + '</small></div><div class="cnt">' + (me.hand ? me.hand.length : 0) + '<small>CARDS</small></div></div>';
    void c;
    // The top card is always the same height, so the tabs and buttons below never move.
    h += S.phase === 'gameOver' ? mainCard(has) : mainCard(has).replace('<div class="card', '<div class="card main');
    if (me.playing && me.hand) h += tabs();
    h += '<a class="link leaveLink" href="#" data-a="leave">' + (S.phase === 'gameOver' || me.out || me.left || !me.playing ? 'Leave this room' : 'Leave the game') + '</a>';
    F.morph($('#play'), h);
    feel(has);
  }

  function clockHtml() {
    var c = G().clock;
    if (!c) return '';
    return '<div class="clock' + (c.left < 10000 ? ' hot' : '') + '"><i style="transform:scaleX(' + (c.left / c.len).toFixed(3) + ');transition:transform ' + (c.left / 1000).toFixed(1) + 's linear" data-live data-key="clk' + c.what + Math.round(c.len) + '"></i></div>';
  }
  function asksHtml(sg) {
    return '<div class="asks">' + sg.ask.map(function (id, k) {
      var st = k > sg.i ? 'wait' : sg.passes.indexOf(id) >= 0 ? 'no' : sg.shower === id ? 'yes' : (sg.waiting && sg.asking === id) ? 'now' : 'wait';
      return '<span class="' + st + '">' + med(suspectOf(id)) + esc(id === me.id ? 'YOU' : pname(id)) + '</span>';
    }).join('') + '</div>';
  }
  function cards3(s, w, r, size) { return '<div class="hand">' + F.cardHtml(T(), s, { size: size || 'sm' }) + F.cardHtml(T(), w, { size: size || 'sm' }) + F.cardHtml(T(), r, { size: size || 'sm' }) + '</div>'; }

  // What the game wants from this phone right now.
  function mainCard(has) {
    var g = G(), t = T(), h;
    if (S.phase === 'gameOver') return endCard();
    if (!me.playing || !me.hand) return '<div class="card"><div class="say"><b>' + esc((pname(g.cur) || '').toUpperCase()) + '’S TURN</b><span>You’re watching this one. Join the next game from the lobby.</span></div></div>';
    if (S.phase === 'intro') {

  }

  function turnCard() {

    // Rolled: pick where to go.

  // The detective notebook. A row is crossed off once someone's ticked as having that card;

  function chatTab() {

  /* -------- the suggestion and accusation sheets */
  function sheetStillOk() {
    if (!S.game || S.phase !== 'turn' || !me.myTurn) return false;

  }
  function openSheet(kind) {
    var g = G(), at = g.pawns[me.suspect];

    ui.pick = { s: pre('S', 6), w: pre('W', 6), r: kind === 'suggest' ? at.r : pre('R', 9) };
    renderSheet();
  }
  function tile(c, on) {
    var t = T(), k = c[0], i = B.cardIndex(c), x = B.cardOf(t, c), mine = me.hand.indexOf(c) >= 0;
    var pic = k === 'S' ? med(i) : F.icon(x.icon), tag = '';
    if (mine) tag = '<i class="mine">YOURS</i>';
    else if (rowKnown(c)) { var who = G().order.filter(function (p) { return markOf(c, p) === 'o'; })[0]; tag = '<i>' + esc(who ? pname(who).slice(0, 6) : 'SEEN') + '</i>'; }
    else if (rowHit(c)) tag = '<i class="hit">!</i>';
    return '<button class="tile' + (on ? ' on' : '') + (mine || rowKnown(c) ? ' known' : '') + '" data-a="pickCard" data-c="' + c + '"><span class="pic">' + pic + '</span><b>' + esc(x.name) + '</b>' + tag + '</button>';
  }
  function renderSheet() {
    var el = $('#sheet');
    if (!el) {
      el = document.createElement('div'); el.id = 'sheet'; el.className = 'sheetBack';
      el.innerHTML = '<div class="sheet"><div class="grip"></div><div id="sheetIn"></div></div>';
      document.body.appendChild(el);
      el.addEventListener('click', function (e) { if (e.target === el) closeSheet(); });
    }
    el.firstElementChild.classList.toggle('acc', ui.sheet === 'accuse');
    var p = ui.pick, acc = ui.sheet === 'accuse', h;
    var list = function (k, n) { var out = ''; for (var i = 0; i < n; i++) out += tile(k + i, p[k.toLowerCase()] === i); return '<div class="tiles">' + out + '</div>'; };
    if (acc) h = '<h2>MAKE AN ACCUSATION</h2><p class="sub">Name all three. If you’re right, you win. If you’re wrong, you’re out of the game (you still show cards).</p>';
    else h = '<h2>SUGGEST IN ' + esc(rThe(p.r).toUpperCase()) + '</h2><p class="sub">The suspect and weapon you name are brought into this room. Then everyone, starting on your left, has to show you one of the three if they can.</p>';
    h += '<div class="label">WHO?</div>' + list('S', 6) + '<div class="label">WITH WHAT?</div>' + list('W', 6);
    if (acc) h += '<div class="label">WHERE?</div>' + list('R', 9);
    var ready = p.s != null && p.w != null && p.r != null;
    h += '<div class="sumLine">' + (ready ? '“' + esc(say3('S' + p.s, 'W' + p.w, 'R' + p.r)) + (acc ? '!”' : '?”') : (acc ? 'Pick a suspect, a weapon and a room.' : 'Pick a suspect and a weapon.')) + '</div>';
    h += '<button class="btn ' + (acc ? 'red' : 'gold') + ' big" data-a="' + (acc ? 'doAccuse' : 'doSuggest') + '"' + (ready ? '' : ' disabled') + '>' + (acc ? 'Accuse' : 'Suggest') + '</button><button class="btn ghost sm" data-a="closeSheet">Cancel</button>';
    var scroll = el.firstElementChild.scrollTop;
    $('#sheetIn').innerHTML = h;
    el.firstElementChild.scrollTop = scroll;
  }
  function closeSheet(now) {
    var el = $('#sheet'); ui.sheet = null;
    if (!el) return;
    if (now) el.remove(); else { el.classList.add('out'); setTimeout(function () { el.remove(); }, 200); }
  }

  /* -------- pops, sounds and buzzes for the things that happen to you */
  var lastTurn = -1, lastMust = false;
  function feel(has) {
    var g = G();
    if (!me.playing) return;
    if (has.start) { sfx.deal(); buzzPhone([40, 40, 40]); }
    // Once per turn of yours, not every time the screen redraws.
    if (me.myTurn && S.phase === 'turn' && lastTurn !== g.turnCount && !g.turn.rolled && !g.turn.moved) { pop('turn', 'YOUR TURN', me.canSuggest && g.turn.stay ? 'You can suggest without moving' : 'Roll the dice'); sfx.turn(); buzzPhone([60, 40, 60]); }
    if (me.myTurn) lastTurn = g.turnCount;
    var must = !!me.mustShow;
    if (must && !lastMust) { sfx.ping(); buzzPhone([80, 50, 80]); pop('dark', 'SHOW A CARD', pname(g.sugg.by) + ' needs an answer', 1300); }
    lastMust = must;
    if (has.roll && has.roll.pid === me.id) sfx.dice();
    if (has.enter && has.enter.pid === me.id) sfx.door();
    if (has.passage && g.players[me.id] && has.passage.s === g.players[me.id].suspect) sfx.secret();
    if (has.suggest && has.suggest.dragged === me.suspect && has.suggest.pid !== me.id) { buzzPhone([100, 60, 100]); pop('dark', 'SUMMONED!', 'You’ve been dragged into ' + rThe(has.suggest.r), 2000); }
    if (has.shown && has.shown.to === me.id && me.justShown) { sfx.show(); buzzPhone(60); pop('good', cname(me.justShown.card).toUpperCase(), pname(me.justShown.from) + ' showed you this', 2200); }
    if (has.shown && has.shown.from === me.id) { sfx.flip(); ui.show = null; }
    if (has.nobody && has.nobody.pid === me.id) { sfx.sting(); buzzPhone([150, 80, 150]); pop('bad', 'NOBODY!', 'Nobody could disprove it', 2200); }
    if (has.wrong && has.wrong.pid === me.id) { sfx.wrong(); buzzPhone([200, 100, 200]); }
    if (has.leftGame && has.leftGame.pid !== me.id) toast(pname(has.leftGame.pid) + ' left. Their cards are face up in your Cards tab.');
    if (has.win) { if (g.winner === me.id) { sfx.right(); buzzPhone([80, 60, 80, 60, 200]); } else if (g.why === 'solved') sfx.wrong(); else sfx.escape(); }
    if (has.auto && has.auto.pid === me.id) toast('Your phone was away, so the game played that one for you.');
  }

  /* ------------------------------------------------------------ taps */
  var pendingNotes = [], noteTimer = null;
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-a]'); if (!b || !S) return;
    var a = b.getAttribute('data-a'), v = b.getAttribute('data-v');
    if (b.tagName === 'A') e.preventDefault();
    sfx.unlock();
    switch (a) {
      case 'suspect': { var s = Number(b.getAttribute('data-s')); send({ t: 'suspect', s: s }); F.store.set('clue.suspect', s); break; }
      case 'start': send({ t: 'h', a: 'start' }); break;
      case 'lobby': send({ t: 'h', a: 'lobby' }); break;
      case 'leave': {
        var g = S.game, live = g && S.phase !== 'gameOver' && me.playing && !me.left, txt;
        if (!g) txt = 'You can join again any time.';
        else if (!live) txt = 'You can come back to watch with the same name.';
        else txt = 'You’re out for good, and your cards go face up on every phone so the others can still solve it.';
        F.dialog({ title: live ? 'LEAVE THE GAME?' : 'LEAVE THIS ROOM?', text: txt, buttons: [{ label: 'Leave', kind: 'red', value: true }, { label: 'Stay', kind: 'ghost', value: false }] }).then(function (ok) { if (ok) { send({ t: 'leave' }); F.store.del('clue.me'); backToJoin(live ? 'You left the game.' : ''); } });
        break;
      }
      case 'tab': ui.tab = v; if (v !== 'chat') ui.chatWith = null; render([]); break;
      case 'roll': b.disabled = true; b.classList.add('spin'); sfx.shake(); buzzPhone(30); send({ t: 'roll' }); break;
      case 'passage': send({ t: 'passage' }); break;
      case 'go': send({ t: 'go', r: Number(b.getAttribute('data-r')) }); break;
      case 'end': send({ t: 'end' }); break;
      case 'openSuggest': openSheet('suggest'); break;
      case 'accuse': openSheet('accuse'); break;
      case 'closeSheet': closeSheet(); break;
      case 'pickCard': {
        var c = b.getAttribute('data-c'), k = c[0].toLowerCase(), i = B.cardIndex(c);
        if (k === 'r' && ui.sheet === 'suggest') break;
        ui.pick[k] = ui.pick[k] === i ? null : i;
        renderSheet();
        break;
      }
      case 'doSuggest': { var p = ui.pick; if (p.s == null || p.w == null) break; send({ t: 'suggest', s: p.s, w: p.w }); closeSheet(); break; }
      case 'doAccuse': {
        var q = ui.pick; if (q.s == null || q.w == null || q.r == null) break;
        F.dialog({ title: 'ARE YOU SURE?', html: '<p>' + esc(say3('S' + q.s, 'W' + q.w, 'R' + q.r)) + '.</p><p>Wrong, and you’re out of the game.</p>', buttons: [{ label: 'Accuse', kind: 'red', value: true }, { label: 'Not yet', kind: 'ghost', value: false }] }).then(function (ok) { if (ok) { send({ t: 'accuse', s: q.s, w: q.w, r: q.r }); closeSheet(); } });
        break;
      }
      case 'pickShow': ui.show = b.getAttribute('data-c'); render([]); break;
      case 'show': if (ui.show) { send({ t: 'show', c: ui.show }); } break;
      case 'mark': {
        var cc = b.getAttribute('data-c'), pp = b.getAttribute('data-p');
        var order = ['', 'x', 'o', '?'], cur = markOf(cc, pp), nx = order[(order.indexOf(cur) + 1) % order.length];
        var row = me.notes[cc] || (me.notes[cc] = {});
        if (nx) row[pp] = nx; else delete row[pp];
        pendingNotes.push({ c: cc, p: pp, m: nx });
        clearTimeout(noteTimer); noteTimer = setTimeout(function () { pendingNotes = []; }, 4000);
        send({ t: 'note', c: cc, p: pp, m: nx });
        buzzPhone(8);
        render([]);
        break;
      }
      case 'chatWith': ui.chatWith = b.getAttribute('data-id'); render([]); setTimeout(function () { var ci = $('#chatIn'); if (ci) ci.focus(); }, 80); break;
      case 'chatBack': ui.chatWith = null; render([]); break;
      case 'chatSend': sendChat(); break;
    }
  });
  function sendChat() {
    var inp = $('#chatIn'); if (!inp || !ui.chatWith) return;
    var text = inp.value.trim(); if (!text) return;
    send({ t: 'chat', to: ui.chatWith, text: text });
    inp.value = ''; inp.focus();
  }
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter' && e.target && e.target.id === 'chatIn') { e.preventDefault(); sendChat(); } });
})();
</script>
</body>
</html>
